[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-sevdesk-sync"
version = "0.1.0"
description = "Sync gross prices from an ERPNext price list to sevDesk as net prices."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.28",
]

[project.scripts]
erpnext-sevdesk-sync = "erpnext_sevdesk_sync.cli:main"

[tool.setuptools.packages.find]
include = ["erpnext_sevdesk_sync*"]
